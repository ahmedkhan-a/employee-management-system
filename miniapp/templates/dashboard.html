<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1 class="mb-4">Employee Dashboard</h1>

    <h2>Total Employees: {{ total_employees }}</h2>


    <h2>Total Departments: {{ departments }}</h2>


<h2 class="mt-4">Employees by Department</h2>

{% for department, count in department_data.items %}
    <p>{{ department }}: {{ count }}</p>
{% endfor %}


 

    <br>

<a href="{% url 'employee_list' %}">View Employees</a>

<br><br>

<a href="{% url 'employee_form' %}">Add Employee</a>

<br><br>

<a href="{% url 'logout' %}">Logout</a>

</body>
</html>
