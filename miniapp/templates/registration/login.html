<!DOCTYPE html>
<html>
<head>

    <title>Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(5, 8, 20, 0.72),
                    rgba(5, 8, 20, 0.88)
                ),
                url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;

            perspective: 1200px;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            filter: blur(50px);

            opacity: 0.45;

            animation: glowMove 9s ease-in-out infinite;
        }


        .glow.one {
            top: -150px;
            left: -120px;

            background: #765cff;
        }


        .glow.two {
            right: -150px;
            bottom: -150px;

            background: #00cfff;

            animation-delay: -4s;
        }


        @keyframes glowMove {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(45px, -30px);
            }

        }


        /* =========================
           FLOATING 3D OBJECTS
        ========================= */

        .shape {
            position: absolute;

            border: 1px solid rgba(255,255,255,0.18);

            background: rgba(255,255,255,0.04);

            backdrop-filter: blur(5px);

            transform-style: preserve-3d;

            animation: rotateShape 15s linear infinite;
        }


        .shape.one {
            width: 80px;
            height: 80px;

            top: 15%;
            left: 8%;
        }


        .shape.two {
            width: 50px;
            height: 50px;

            top: 25%;
            right: 12%;

            animation-duration: 10s;

            animation-direction: reverse;
        }


        .shape.three {
            width: 35px;
            height: 35px;

            bottom: 18%;
            left: 15%;

            animation-duration: 8s;
        }


        @keyframes rotateShape {

            0% {
                transform:
                    rotateX(0deg)
                    rotateY(0deg)
                    rotateZ(0deg);
            }

            50% {
                transform:
                    rotateX(180deg)
                    rotateY(180deg)
                    rotateZ(90deg);
            }

            100% {
                transform:
                    rotateX(360deg)
                    rotateY(360deg)
                    rotateZ(180deg);
            }

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .page {
            position: relative;

            z-index: 5;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            animation: pageIn 1.1s ease;
        }


        @keyframes pageIn {

            from {
                opacity: 0;

                transform:
                    translateY(40px)
                    rotateX(8deg);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0);
            }

        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {

            width: 100%;

            max-width: 470px;

            padding: 42px;

            border-radius: 30px;

            background:
                rgba(15, 20, 40, 0.62);

            border:
                1px solid rgba(255,255,255,0.16);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 35px 90px rgba(0,0,0,0.55),
                inset 0 1px 1px rgba(255,255,255,0.12);

            transform-style: preserve-3d;

            transition:
                transform 0.5s ease,
                box-shadow 0.5s ease;
        }


        .login-card:hover {

            transform:
                rotateX(2deg)
                rotateY(-2deg)
                translateZ(15px);

            box-shadow:
                0 45px 100px rgba(0,0,0,0.65),
                0 0 50px rgba(100,90,255,0.12);
        }


        /* =========================
           ICON
        ========================= */

        .admin-icon {

            width: 85px;
            height: 85px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 25px;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,92,255,0.9),
                    rgba(0,207,255,0.65)
                );

            box-shadow:
                0 20px 40px rgba(0,0,0,0.4),
                0 0 30px rgba(124,92,255,0.25);

            transform: translateZ(35px);

            animation: iconFloat 4s ease-in-out infinite;
        }


        @keyframes iconFloat {

            0%, 100% {
                transform:
                    translateZ(35px)
                    translateY(0);
            }

            50% {
                transform:
                    translateZ(55px)
                    translateY(-8px);
            }

        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            margin-bottom: 8px;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: -1px;

            text-shadow:
                0 0 25px rgba(124,92,255,0.45);
        }


        .subtitle {

            text-align: center;

            margin-bottom: 32px;

            color:
                rgba(255,255,255,0.52);

            font-size: 14px;
        }


        /* =========================
           DJANGO FORM
        ========================= */

        form p {

            margin-bottom: 20px;
        }


        form label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,0.75);

            font-size: 14px;

            font-weight: 600;
        }


        form input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 13px;

            border:
                1px solid rgba(255,255,255,0.13);

            outline: none;

            color: white;

            background:
                rgba(0,0,0,0.28);

            transition:
                border 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }


        form input:focus {

            border-color:
                #7c5cff;

            box-shadow:
                0 0 0 3px rgba(124,92,255,0.15),
                0 0 25px rgba(124,92,255,0.20);

            transform:
                translateY(-2px);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #765cff,
                    #00bfe8
                );

            box-shadow:
                0 15px 30px rgba(70,90,255,0.30);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .login-btn:hover {

            transform:
                translateY(-5px)
                scale(1.02);

            box-shadow:
                0 20px 40px rgba(70,150,255,0.45);
        }


        .login-btn:active {

            transform:
                translateY(-1px)
                scale(0.99);
        }


        /* =========================
           BOTTOM TEXT
        ========================= */

        .secure-text {

            margin-top: 22px;

            text-align: center;

            color:
                rgba(255,255,255,0.38);

            font-size: 12px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }


            .page {
                padding: 20px;
            }


            .login-card {
                padding: 30px 24px;

                border-radius: 24px;
            }


            .title {
                font-size: 29px;
            }


            .admin-icon {
                width: 70px;
                height: 70px;

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ANIMATED BACKGROUND
    ========================== -->

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

        <div class="shape one"></div>

        <div class="shape two"></div>

        <div class="shape three"></div>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <main class="page">

        <section class="login-card">


            <div class="admin-icon">
                🔐
            </div>


            <h1 class="title">
                Admin Login
            </h1>


            <p class="subtitle">
                Employee Management System
            </p>


            <!-- SAME DJANGO LOGIC -->

            <form
                method="POST"
                action="{% url 'login' %}"
            >

                {% csrf_token %}

                {{ form.as_p }}


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login →
                </button>

            </form>


            <div class="secure-text">
                🔒 Secure administrator access
            </div>


        </section>

    </main>


</body>
</html>
