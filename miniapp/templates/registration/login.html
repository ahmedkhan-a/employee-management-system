 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AKFLIX | Admin Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            overflow: hidden;

            background: #030303;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           3D CINEMA WORLD
        ===================================================== */

        .cinema-world {

            position: fixed;

            inset: 0;

            overflow: hidden;

            perspective: 1200px;

            background:

                radial-gradient(
                    circle at 50% 50%,
                    rgba(229, 9, 20, 0.13),
                    transparent 35%
                ),

                #030303;

            z-index: -5;
        }


        /* =====================================================
           MOVING RED LIGHT
        ===================================================== */

        .red-glow {

            position: absolute;

            width: 600px;
            height: 600px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(229, 9, 20, 0.10);

            filter: blur(100px);

            animation:
                glowPulse 7s ease-in-out infinite;
        }


        @keyframes glowPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: .5;
            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.35);

                opacity: 1;
            }

        }


        /* =====================================================
           3D FILM REEL
        ===================================================== */

        .film-reel {

            position: absolute;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            border:
                9px solid
                rgba(255,255,255,.08);

            box-shadow:

                inset
                0 0 25px
                rgba(255,255,255,.04),

                0 0 40px
                rgba(229,9,20,.08);

            transform-style:
                preserve-3d;

            animation:
                reelRotate 16s linear infinite;
        }


        .film-reel::before {

            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                5px solid
                rgba(255,255,255,.12);
        }


        .film-reel::after {

            content: "";

            position: absolute;

            width: 100%;
            height: 7px;

            left: 0;
            top: 50%;

            background:
                rgba(255,255,255,.05);

            transform:
                rotate(45deg);
        }


        @keyframes reelRotate {

            from {
                transform:
                    rotateX(20deg)
                    rotateY(0deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    rotateX(20deg)
                    rotateY(360deg)
                    rotateZ(360deg);
            }

        }


        .reel-left {

            left: 6%;
            top: 12%;

        }


        .reel-right {

            right: 7%;
            bottom: 10%;

            width: 120px;
            height: 120px;

            animation-duration:
                12s;

            animation-direction:
                reverse;
        }


        /* =====================================================
           FLOATING MOVIE CARDS
        ===================================================== */

        .movie-card {

            position: absolute;

            width: 125px;
            height: 175px;

            border-radius: 14px;

            background:

                linear-gradient(
                    145deg,
                    rgba(229,9,20,.32),
                    rgba(255,255,255,.03)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:

                0 30px 60px
                rgba(0,0,0,.6);

            backdrop-filter:
                blur(5px);

            transform-style:
                preserve-3d;

            animation:
                cardFloat 8s ease-in-out infinite;
        }


        .movie-card::before {

            content:
                "AKFLIX";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,.12);
        }


        .movie-card::after {

            content: "";

            position: absolute;

            inset: 10px;

            border:
                1px solid
                rgba(255,255,255,.06);

            border-radius: 10px;
        }


        @keyframes cardFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotateY(20deg)
                    rotateZ(-5deg);
            }

            50% {

                transform:
                    translateY(-30px)
                    rotateY(-15deg)
                    rotateZ(5deg);
            }

        }


        .card-left {

            left: 17%;
            bottom: 13%;

        }


        .card-right {

            right: 17%;
            top: 17%;

            animation-delay:
                2s;
        }


        /* =====================================================
           FLOATING CINEMA ORBS
        ===================================================== */

        .orb {

            position: absolute;

            border-radius: 50%;

            background:
                rgba(229,9,20,.15);

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 0 30px
                rgba(229,9,20,.15);

            animation:
                orbFloat 10s ease-in-out infinite;
        }


        .orb-one {

            width: 35px;
            height: 35px;

            left: 27%;
            top: 25%;
        }


        .orb-two {

            width: 20px;
            height: 20px;

            right: 28%;
            bottom: 27%;

            animation-delay:
                2s;
        }


        .orb-three {

            width: 50px;
            height: 50px;

            right: 10%;
            top: 42%;

            animation-delay:
                4s;
        }


        @keyframes orbFloat {

            0%,
            100% {

                transform:
                    translate3d(0,0,0);

            }

            50% {

                transform:
                    translate3d(0,-35px,40px);

            }

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.55);

            box-shadow:
                0 0 12px
                rgba(229,9,20,.8);

            animation:
                particleRise 9s linear infinite;
        }


        @keyframes particleRise {

            0% {

                transform:
                    translateY(100vh)
                    scale(0);

                opacity: 0;

            }

            20% {

                opacity: 1;

            }

            80% {

                opacity: 1;

            }

            100% {

                transform:
                    translateY(-20vh)
                    translateX(80px)
                    scale(1.5);

                opacity: 0;

            }

        }


        .p1 {
            left: 10%;
        }

        .p2 {
            left: 25%;
            animation-delay: 2s;
        }

        .p3 {
            left: 45%;
            animation-delay: 4s;
        }

        .p4 {
            left: 70%;
            animation-delay: 1s;
        }

        .p5 {
            left: 90%;
            animation-delay: 3s;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            position: absolute;

            top: 30px;
            left: 42px;

            font-size: 25px;

            font-weight: 900;

            letter-spacing: 4px;

            color: #e50914;

            text-shadow:
                0 0 25px
                rgba(229,9,20,.5);

        }


        .brand span {

            color: white;

            font-weight: 400;

            letter-spacing: 2px;
        }


        /* =====================================================
           LOGIN AREA
        ===================================================== */

        .login-wrapper {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        /* =====================================================
           GLASS LOGIN PANEL
        ===================================================== */

        .login-panel {

            position: relative;

            width: 420px;

            padding: 42px;

            border-radius: 24px;

            background:
                rgba(8,8,8,.78);

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(25px);

            box-shadow:

                0 40px 100px
                rgba(0,0,0,.75),

                0 0 60px
                rgba(229,9,20,.08);

            animation:
                panelEnter 1s ease;
        }


        @keyframes panelEnter {

            from {

                opacity: 0;

                transform:
                    translateY(45px)
                    rotateX(10deg)
                    scale(.94);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0)
                    scale(1);

            }

        }


        /* TOP RED LINE */

        .top-line {

            width: 55px;
            height: 4px;

            border-radius: 20px;

            background:
                #e50914;

            box-shadow:
                0 0 18px
                rgba(229,9,20,.6);

            margin-bottom: 20px;
        }


        .login-title {

            margin: 0;

            font-size: 34px;

            font-weight: 800;
        }


        .login-subtitle {

            margin-top: 8px;
            margin-bottom: 28px;

            color: #888;

            font-size: 13px;
        }


        /* =====================================================
           DJANGO MESSAGES
        ===================================================== */

        .message {

            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 9px;

            background:
                rgba(229,9,20,.10);

            border:
                1px solid
                rgba(229,9,20,.3);

            color:
                #ff9c9c;

            font-size: 13px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .field {

            margin-bottom: 21px;
        }


        .field label {

            display: block;

            margin-bottom: 7px;

            color: #aaa;

            font-size: 12px;
        }


        .field input {

            width: 100%;

            height: 52px;

            padding:
                0 15px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,.11);

            background:
                rgba(255,255,255,.055);

            color: white;

            outline: none;

            transition:
                .3s ease;
        }


        .field input:focus {

            border-color:
                #e50914;

            box-shadow:

                0 0 0 3px
                rgba(229,9,20,.10),

                0 0 20px
                rgba(229,9,20,.10);
        }


        .field input::placeholder {

            color: #555;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 52px;

            margin-top: 4px;

            border: none;

            border-radius: 10px;

            background:
                #e50914;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                .3s ease;
        }


        .login-button:hover {

            background:
                #ff1723;

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(229,9,20,.35);
        }


        .login-button:active {

            transform:
                scale(.98);
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        .register-text {

            text-align: center;

            margin-top: 24px;

            margin-bottom: 0;

            color: #777;

            font-size: 13px;
        }


        .register-link {

            color: white;

            text-decoration: none;

            font-weight: 700;

            transition:
                .3s;
        }


        .register-link:hover {

            color:
                #e50914;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:600px) {

            body {
                overflow-y: auto;
            }

            .brand {

                top: 20px;
                left: 22px;

                font-size: 20px;
            }

            .login-wrapper {

                padding:
                    80px 18px 30px;
            }

            .login-panel {

                width: 100%;

                padding:
                    32px 25px;
            }

            .login-title {

                font-size: 28px;
            }

            .film-reel,
            .movie-card {

                opacity: .35;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         3D BACKGROUND
    ===================================================== -->

    <div class="cinema-world">

        <div class="red-glow"></div>

        <div class="film-reel reel-left"></div>

        <div class="film-reel reel-right"></div>

        <div class="movie-card card-left"></div>

        <div class="movie-card card-right"></div>

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="particle p1"></div>

        <div class="particle p2"></div>

        <div class="particle p3"></div>

        <div class="particle p4"></div>

        <div class="particle p5"></div>

    </div>


    <!-- =====================================================
         BRAND
    ===================================================== -->

    <div class="brand">

        AK<span>FLIX</span>

    </div>


    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <main class="login-wrapper">

        <section class="login-panel">


            <div class="top-line"></div>


            <h1 class="login-title">

                Welcome Back

            </h1>


            <p class="login-subtitle">

                Enter your credentials to access the workspace

            </p>


            <!-- DJANGO MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{% url 'login' %}"
            >

                {% csrf_token %}


                <div class="field">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >

                    Sign In

                </button>


            </form>


            <p class="register-text">

                Don't have an account?

                <a
                    href="{% url 'register' %}"
                    class="register-link"
                >

                    Register here

                </a>

            </p>


        </section>

    </main>


    <!-- =====================================================
         MOUSE PARALLAX
    ===================================================== -->

    <script>

        const world =
            document.querySelector(".cinema-world");

        document.addEventListener(
            "mousemove",
            function(event) {

                const x =
                    (event.clientX /
                    window.innerWidth - 0.5) * 2;

                const y =
                    (event.clientY /
                    window.innerHeight - 0.5) * 2;


                world.style.transform =
                    `translate3d(
                        ${x * -10}px,
                        ${y * -10}px,
                        0
                    )`;

            }
        );

    </script>


</body>

</html>
