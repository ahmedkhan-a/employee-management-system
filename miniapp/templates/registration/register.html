<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKFLIX | Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background: #050505;
        }

        /* =====================================================
           3D CINEMA BACKGROUND
        ===================================================== */

        .scene {
            position: fixed;
            inset: 0;
            overflow: hidden;

            perspective: 1000px;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(229, 9, 20, 0.12),
                    transparent 35%
                ),
                #050505;

            z-index: -10;
        }

        /* RED LIGHT */

        .red-light {
            position: absolute;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(229, 9, 20, 0.08);

            filter: blur(100px);

            animation: lightPulse 6s ease-in-out infinite;
        }

        @keyframes lightPulse {

            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.35);
                opacity: 1;
            }

        }

        /* =====================================================
           FLOATING FILM REELS
        ===================================================== */

        .reel {
            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            border: 8px solid rgba(255,255,255,0.08);

            box-shadow:
                inset 0 0 20px rgba(255,255,255,0.04),
                0 0 30px rgba(229,9,20,0.08);

            animation: reelSpin 15s linear infinite;
        }

        .reel::before {
            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border: 5px solid rgba(255,255,255,0.12);
        }

        .reel::after {
            content: "";

            position: absolute;

            width: 80%;
            height: 8px;

            top: 50%;
            left: 10%;

            background: rgba(255,255,255,0.06);

            transform: rotate(45deg);
        }

        @keyframes reelSpin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .reel-one {

            left: 7%;
            top: 14%;

            animation-duration: 18s;

        }

        .reel-two {

            right: 8%;
            bottom: 12%;

            width: 110px;
            height: 110px;

            animation-duration: 13s;
            animation-direction: reverse;

        }

        /* =====================================================
           FLOATING CINEMA CARDS
        ===================================================== */

        .poster {

            position: absolute;

            width: 110px;
            height: 155px;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    rgba(229,9,20,0.35),
                    rgba(255,255,255,0.04)
                );

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 25px 50px rgba(0,0,0,0.5);

            backdrop-filter: blur(5px);

            transform-style: preserve-3d;

            animation: posterFloat 7s ease-in-out infinite;
        }

        .poster::before {

            content: "AK";

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 28px;
            font-weight: 900;

            color: rgba(255,255,255,0.12);

        }

        .poster-one {

            left: 17%;
            bottom: 15%;

            transform: rotateY(25deg) rotateZ(-8deg);

        }

        .poster-two {

            right: 18%;
            top: 18%;

            transform: rotateY(-25deg) rotateZ(8deg);

            animation-delay: 2s;

        }

        @keyframes posterFloat {

            0%, 100% {

                translate: 0 0;
                rotate: 0deg;

            }

            50% {

                translate: 0 -25px;
                rotate: 4deg;

            }

        }

        /* =====================================================
           FLOATING PARTICLES
        ===================================================== */

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: rgba(255,255,255,0.4);

            box-shadow:
                0 0 12px rgba(229,9,20,0.7);

            animation: particleMove 8s linear infinite;

        }

        @keyframes particleMove {

            0% {

                transform:
                    translateY(100vh)
                    translateX(0)
                    scale(0);

                opacity: 0;

            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(-20vh)
                    translateX(80px)
                    scale(1.5);

                opacity: 0;

            }

        }

        .p1 {
            left: 10%;
            animation-delay: 0s;
        }

        .p2 {
            left: 30%;
            animation-delay: 2s;
        }

        .p3 {
            left: 70%;
            animation-delay: 4s;
        }

        .p4 {
            left: 90%;
            animation-delay: 1s;
        }

        .p5 {
            left: 55%;
            animation-delay: 3s;
        }

        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            position: absolute;

            top: 30px;
            left: 40px;

            font-size: 25px;
            font-weight: 900;

            letter-spacing: 4px;

            color: #e50914;

            text-shadow:
                0 0 25px rgba(229,9,20,0.5);

        }

        .brand span {

            color: white;

            font-weight: 400;

        }

        /* =====================================================
           REGISTER CONTAINER
        ===================================================== */

        .register-wrapper {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 30px;

        }

        /* =====================================================
           GLASS CARD
        ===================================================== */

        .register-card {

            position: relative;

            width: 470px;

            padding: 38px 42px;

            border-radius: 24px;

            background:
                rgba(12,12,12,0.78);

            border:
                1px solid rgba(255,255,255,0.10);

            backdrop-filter: blur(25px);

            box-shadow:

                0 40px 100px rgba(0,0,0,0.7),

                0 0 50px rgba(229,9,20,0.08);

            animation: cardAppear 1s ease forwards;

        }

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(50px)
                    rotateX(8deg)
                    scale(0.94);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0)
                    scale(1);

            }

        }

        /* TOP LINE */

        .card-line {

            width: 55px;
            height: 4px;

            background: #e50914;

            border-radius: 10px;

            margin-bottom: 18px;

            box-shadow:
                0 0 15px rgba(229,9,20,0.5);

        }

        .register-title {

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 5px;

        }

        .register-subtitle {

            color: #888;

            font-size: 13px;

            margin-bottom: 25px;

        }

        /* =====================================================
           DJANGO FORM
        ===================================================== */

        form p {

            margin-bottom: 15px;

        }

        form label {

            display: block;

            margin-bottom: 6px;

            font-size: 12px;

            color: #aaa;

        }

        form input {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            color: white;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 9px;

            outline: none;

            transition: 0.3s ease;

        }

        form input:focus {

            border-color: #e50914;

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                0 0 0 3px rgba(229,9,20,0.10);

        }

        form input::placeholder {

            color: #555;

        }

        /* ERRORS */

        .errorlist {

            padding: 0;

            margin: 5px 0;

            list-style: none;

            color: #ff6b6b;

            font-size: 11px;

        }

        /* REGISTER BUTTON */

        .register-button {

            width: 100%;

            height: 50px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #e50914;

            color: white;

            font-weight: 700;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.3s ease;

        }

        .register-button:hover {

            background: #ff1824;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(229,9,20,0.35);

        }

        .register-button:active {

            transform: scale(0.98);

        }

        /* LOGIN LINK */

        .login-text {

            text-align: center;

            margin-top: 22px;

            margin-bottom: 0;

            color: #777;

            font-size: 13px;

        }

        .login-link {

            color: white;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s;

        }

        .login-link:hover {

            color: #e50914;

        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .brand {

                left: 22px;
                top: 20px;

                font-size: 20px;

            }

            .register-wrapper {

                padding: 80px 18px 30px;

            }

            .register-card {

                width: 100%;

                padding: 30px 24px;

            }

            .register-title {

                font-size: 27px;

            }

            .reel,
            .poster {

                opacity: 0.3;

            }

        }

    </style>
</head>

<body>

    <!-- =====================================================
         3D BACKGROUND
    ===================================================== -->

    <div class="scene">

        <div class="red-light"></div>

        <div class="reel reel-one"></div>

        <div class="reel reel-two"></div>

        <div class="poster poster-one"></div>

        <div class="poster poster-two"></div>

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>

    </div>


    <!-- BRAND -->

    <div class="brand">
        AK<span>FLIX</span>
    </div>


    <!-- =====================================================
         REGISTRATION
    ===================================================== -->

    <main class="register-wrapper">

        <section class="register-card">

            <div class="card-line"></div>

            <h1 class="register-title">
                Create Account
            </h1>

            <p class="register-subtitle">
                Join the cinematic workspace
            </p>


            <!-- YOUR EXISTING DJANGO FORM -->

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a
                    href="{% url 'login' %}"
                    class="login-link"
                >
                    Login here
                </a>

            </p>

        </section>

    </main>

</body>
</html>
