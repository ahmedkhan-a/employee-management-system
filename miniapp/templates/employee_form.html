<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKFLIX | Add Employee</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #030303;

            overflow-x: hidden;

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .scene {

            position: fixed;
            inset: 0;

            overflow: hidden;

            perspective: 1200px;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(229, 9, 20, .13),
                    transparent 35%
                ),

                #030303;

            z-index: -10;

        }


        .glow {

            position: absolute;

            width: 550px;
            height: 550px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(229, 9, 20, .08);

            filter: blur(100px);

            animation:
                glowMove 7s ease-in-out infinite;

        }


        @keyframes glowMove {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.35);

            }

        }


        /* =====================================================
           FLOATING 3D OBJECTS
        ===================================================== */

        .object {

            position: absolute;

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.025);

            backdrop-filter:
                blur(5px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.5);

            transform-style:
                preserve-3d;

            animation:
                floating 9s ease-in-out infinite;

        }


        .object-one {

            width: 180px;
            height: 180px;

            left: 5%;
            top: 15%;

            border-radius: 50%;

            border-width: 7px;

        }


        .object-two {

            width: 130px;
            height: 180px;

            right: 6%;
            top: 18%;

            border-radius: 18px;

            transform:
                rotateY(25deg)
                rotateZ(8deg);

            animation-delay: 2s;

        }


        .object-three {

            width: 90px;
            height: 90px;

            left: 12%;
            bottom: 10%;

            border-radius: 50%;

            animation-delay: 4s;

        }


        .object-four {

            width: 150px;
            height: 80px;

            right: 12%;
            bottom: 12%;

            border-radius: 15px;

            transform:
                rotateY(-25deg)
                rotateZ(-7deg);

            animation-delay: 1s;

        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translate3d(0,0,0)
                    rotateY(15deg);

            }

            50% {

                transform:
                    translate3d(0,-35px,50px)
                    rotateY(-15deg);

            }

        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.45);

            box-shadow:
                0 0 12px
                rgba(229,9,20,.8);

            animation:
                rise 10s linear infinite;

        }


        @keyframes rise {

            from {

                transform:
                    translateY(100vh);

                opacity: 0;

            }

            20% {

                opacity: 1;

            }

            80% {

                opacity: 1;

            }

            to {

                transform:
                    translateY(-20vh)
                    translateX(100px);

                opacity: 0;

            }

        }


        .p1 {
            left: 10%;
        }

        .p2 {
            left: 30%;
            animation-delay: 2s;
        }

        .p3 {
            left: 50%;
            animation-delay: 4s;
        }

        .p4 {
            left: 75%;
            animation-delay: 1s;
        }

        .p5 {
            left: 90%;
            animation-delay: 3s;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .page {

            width: 92%;
            max-width: 850px;

            margin: auto;

            padding:
                35px 0 60px;

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 45px;

        }


        .brand {

            font-size: 25px;

            font-weight: 900;

            letter-spacing: 4px;

            color:
                #e50914;

            text-shadow:
                0 0 25px
                rgba(229,9,20,.5);

        }


        .brand span {

            color: white;

            font-weight: 400;

        }


        .dashboard-link {

            color: #aaa;

            text-decoration: none;

            padding:
                9px 17px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 8px;

            background:
                rgba(255,255,255,.04);

            transition: .3s;

        }


        .dashboard-link:hover {

            color: white;

            border-color:
                rgba(229,9,20,.5);

            transform:
                translateY(-2px);

        }


        /* =====================================================
           HEADING
        ===================================================== */

        .heading {

            margin-bottom: 30px;

        }


        .heading small {

            color: #777;

            letter-spacing: 2px;

            text-transform:
                uppercase;

        }


        .heading h1 {

            margin:
                8px 0 0;

            font-size:
                clamp(32px, 5vw, 52px);

            font-weight: 800;

        }


        .heading h1 span {

            color:
                #e50914;

        }


        /* =====================================================
           FORM CARD
        ===================================================== */

        .form-card {

            padding: 35px;

            border-radius: 24px;

            background:
                rgba(10,10,10,.78);

            border:
                1px solid
                rgba(255,255,255,.10);

            backdrop-filter:
                blur(25px);

            box-shadow:

                0 40px 100px
                rgba(0,0,0,.65),

                0 0 50px
                rgba(229,9,20,.07);

            animation:
                cardEnter .8s ease;

        }


        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    rotateX(8deg)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0)
                    scale(1);

            }

        }


        /* =====================================================
           DJANGO FORM
        ===================================================== */

        .django-form p {

            margin-bottom: 22px;

        }


        .django-form label {

            display: block;

            margin-bottom: 8px;

            color: #aaa;

            font-size: 12px;

            font-weight: 700;

            text-transform:
                uppercase;

            letter-spacing: 1.3px;

        }


        .django-form input,
        .django-form select,
        .django-form textarea {

            width: 100%;

            padding:
                14px 16px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255,255,255,.045);

            color: white;

            font-size: 15px;

            transition: .3s;

        }


        .django-form input:focus,
        .django-form select:focus,
        .django-form textarea:focus {

            border-color:
                #e50914;

            background:
                rgba(229,9,20,.045);

            box-shadow:
                0 0 0 3px
                rgba(229,9,20,.08);

        }


        .django-form select option {

            background: #111;

            color: white;

        }


        .django-form textarea {

            min-height: 110px;

            resize: vertical;

        }


        .helptext {

            display: block;

            margin-top: 6px;

            color: #666;

            font-size: 11px;

        }


        .errorlist {

            padding: 0;

            margin:
                5px 0 8px;

            list-style: none;

            color:
                #ff6969;

            font-size: 12px;

        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .form-actions {

            display: flex;

            gap: 12px;

            align-items:
                center;

            margin-top: 30px;

            padding-top: 25px;

            border-top:
                1px solid
                rgba(255,255,255,.08);

        }


        .save-button {

            border: none;

            padding:
                14px 28px;

            border-radius: 10px;

            background:
                #e50914;

            color: white;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: .3s;

            box-shadow:
                0 10px 30px
                rgba(229,9,20,.18);

        }


        .save-button:hover {

            background:
                #ff1824;

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(229,9,20,.35);

        }


        .cancel-button {

            text-decoration: none;

            padding:
                13px 22px;

            border-radius: 10px;

            color: #bbb;

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.04);

            transition: .3s;

        }


        .cancel-button:hover {

            color: white;

            background:
                rgba(255,255,255,.09);

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:700px) {

            .page {

                width: 90%;

            }

            .form-card {

                padding: 24px;

            }

            .object {

                opacity: .25;

            }

            .form-actions {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }

            .save-button,
            .cancel-button {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ANIMATED BACKGROUND
    ===================================================== -->

    <div class="scene">

        <div class="glow"></div>

        <div class="object object-one"></div>

        <div class="object object-two"></div>

        <div class="object object-three"></div>

        <div class="object object-four"></div>

        <div class="particle p1"></div>

        <div class="particle p2"></div>

        <div class="particle p3"></div>

        <div class="particle p4"></div>

        <div class="particle p5"></div>

    </div>


    <!-- =====================================================
         MAIN PAGE
    ===================================================== -->

    <main class="page">


        <!-- TOP BAR -->

        <nav class="topbar">

            <div class="brand">

                AK<span>FLIX</span>

            </div>


            <a
                href="{% url 'dashboard' %}"
                class="dashboard-link"
            >

                ← Dashboard

            </a>

        </nav>


        <!-- HEADING -->

        <section class="heading">

            <small>
                Employee Management
            </small>

            <h1>

                Add
                <span>Employee</span>

            </h1>

        </section>


        <!-- =================================================
             FORM
        ================================================= -->

        <section class="form-card">


            <form
                method="POST"
                class="django-form"
            >

                {% csrf_token %}


                {{ form.as_p }}


                <div class="form-actions">


                    <button
                        type="submit"
                        class="save-button"
                    >

                        Save Employee →

                    </button>


                    <a
                        href="{% url 'employee_list' %}"
                        class="cancel-button"
                    >

                        Cancel

                    </a>


                </div>


            </form>


        </section>


    </main>


    <!-- =====================================================
         MOUSE PARALLAX
    ===================================================== -->

    <script>

        const scene =
            document.querySelector(".scene");


        document.addEventListener(
            "mousemove",
            function(event) {

                const x =
                    (event.clientX /
                    window.innerWidth - .5) * 2;

                const y =
                    (event.clientY /
                    window.innerHeight - .5) * 2;


                scene.style.transform =
                    `translate3d(
                        ${x * -8}px,
                        ${y * -8}px,
                        0
                    )`;

            }
        );

    </script>


</body>

</html>
