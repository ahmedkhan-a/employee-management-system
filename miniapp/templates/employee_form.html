```html
<!DOCTYPE html>
<html>
<head>

    <title>Add Employee</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
>




    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(5, 8, 20, 0.78),
                    rgba(5, 8, 20, 0.94)
                ),
                url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            perspective: 1200px;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .glow {
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            filter: blur(55px);

            opacity: 0.38;

            animation: glowMove 10s ease-in-out infinite;
        }


        .glow.one {
            top: -150px;
            left: -120px;

            background: #765cff;
        }


        .glow.two {
            right: -150px;
            bottom: -150px;

            background: #00d5ff;

            animation-delay: -4s;
        }


        @keyframes glowMove {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(45px, -35px);
            }

        }


        /* =========================
           3D FLOATING SHAPES
        ========================= */

        .shape {
            position: absolute;

            border: 1px solid rgba(255,255,255,0.16);

            background: rgba(255,255,255,0.035);

            backdrop-filter: blur(5px);

            transform-style: preserve-3d;

            animation: rotateShape 15s linear infinite;
        }


        .shape.one {
            width: 75px;
            height: 75px;

            top: 16%;
            left: 7%;
        }


        .shape.two {
            width: 45px;
            height: 45px;

            right: 10%;
            top: 25%;

            animation-duration: 10s;

            animation-direction: reverse;
        }


        .shape.three {
            width: 30px;
            height: 30px;

            left: 15%;
            bottom: 15%;

            animation-duration: 8s;
        }


        @keyframes rotateShape {

            0% {
                transform:
                    rotateX(0deg)
                    rotateY(0deg)
                    rotateZ(0deg);
            }

            50% {
                transform:
                    rotateX(180deg)
                    rotateY(180deg)
                    rotateZ(90deg);
            }

            100% {
                transform:
                    rotateX(360deg)
                    rotateY(360deg)
                    rotateZ(180deg);
            }

        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {

            position: relative;

            z-index: 5;

            width: 92%;

            max-width: 850px;

            margin: 45px auto;

            animation: pageIn 1s ease;
        }


        @keyframes pageIn {

            from {
                opacity: 0;

                transform:
                    translateY(45px)
                    rotateX(8deg);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0);
            }

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 30px;

            margin-bottom: 22px;

            border-radius: 26px;

            background:
                rgba(15,20,40,0.64);

            border:
                1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(25px);

            box-shadow:
                0 30px 70px rgba(0,0,0,0.45),
                inset 0 1px 1px rgba(255,255,255,0.12);

            transform-style: preserve-3d;

            transition: 0.4s ease;
        }


        .header:hover {

            transform:
                rotateX(2deg)
                rotateY(-2deg)
                translateZ(10px);
        }


        .add-icon {

            width: 75px;
            height: 75px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 35px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,92,255,0.9),
                    rgba(0,207,255,0.65)
                );

            box-shadow:
                0 18px 40px rgba(0,0,0,0.4);

            transform: translateZ(30px);

            animation: iconFloat 4s ease-in-out infinite;
        }


        @keyframes iconFloat {

            0%, 100% {
                transform:
                    translateZ(30px)
                    translateY(0);
            }

            50% {
                transform:
                    translateZ(50px)
                    translateY(-7px);
            }

        }


        .header h1 {

            margin: 0;

            font-size: 32px;

            font-weight: 700;

            text-shadow:
                0 0 25px rgba(124,92,255,0.45);
        }


        .header p {

            margin: 5px 0 0;

            color:
                rgba(255,255,255,0.50);

            font-size: 14px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {

            padding: 35px;

            border-radius: 27px;

            background:
                rgba(15,20,40,0.64);

            border:
                1px solid rgba(255,255,255,0.14);

            backdrop-filter: blur(25px);

            box-shadow:
                0 30px 70px rgba(0,0,0,0.45);

            transform-style: preserve-3d;

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        .form-card:hover {

            transform:
                translateY(-4px)
                rotateX(2deg)
                rotateY(-2deg)
                translateZ(10px);

            box-shadow:
                0 40px 85px rgba(0,0,0,0.55);
        }


        /* =========================
           DJANGO FORM
        ========================= */

        form p {

            margin-bottom: 20px;
        }


        form label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,0.72);

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 0.3px;
        }


        form input,
        form select,
        form textarea {

            width: 100%;

            padding: 14px 16px;

            border-radius: 13px;

            border:
                1px solid rgba(255,255,255,0.13);

            outline: none;

            color: white;

            background:
                rgba(0,0,0,0.28);

            transition:
                border 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }


        form input:focus,
        form select:focus,
        form textarea:focus {

            border-color:
                #7c5cff;

            box-shadow:
                0 0 0 3px rgba(124,92,255,0.15),
                0 0 25px rgba(124,92,255,0.20);

            transform:
                translateY(-2px);
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        .save-btn {

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #765cff,
                    #00bfe8
                );

            box-shadow:
                0 15px 30px rgba(70,90,255,0.30);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .save-btn:hover {

            transform:
                translateY(-5px)
                scale(1.01);

            box-shadow:
                0 20px 40px rgba(70,150,255,0.45);
        }


        .save-btn:active {

            transform:
                translateY(-1px);
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 25px;
        }


        .nav-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 13px 21px;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            font-weight: 600;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }


        .nav-btn:hover {

            color: white;

            transform:
                translateY(-5px)
                scale(1.02);

            background:
                linear-gradient(
                    135deg,
                    rgba(124,92,255,0.80),
                    rgba(0,217,255,0.55)
                );

            box-shadow:
                0 15px 30px rgba(0,0,0,0.35);
        }


        /* =========================
           BOTTOM LINK
        ========================= */

        .back-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color:
                rgba(255,255,255,0.55);

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.3s ease;
        }


        .back-link:hover {

            color: white;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .page {

                width: 92%;

                margin: 25px auto;
            }


            .header {

                padding: 24px;
            }


            .header h1 {

                font-size: 26px;
            }


            .form-card {

                padding: 24px;
            }


            .navigation {

                flex-direction: column;
            }


            .nav-btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ANIMATED BACKGROUND
    ========================= -->

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

        <div class="shape one"></div>

        <div class="shape two"></div>

        <div class="shape three"></div>

    </div>


    <!-- =========================
         MAIN PAGE
    ========================= -->

    <main class="page">


        <!-- HEADER -->

        <section class="header">

            <div class="add-icon">
                ➕
            </div>

            <div>

                <h1>
                    Add Employee
                </h1>

                <p>
                    Create a new employee profile
                </p>

            </div>

        </section>


        <!-- =========================
             FORM
        ========================= -->

        <section class="form-card">


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <button
                    type="submit"
                    class="save-btn"
>
                    <i class="bi bi-plus-circle"></i>
                    Save Employee
                </button>

            </form>


            <!-- =========================
                 NAVIGATION
            ========================= -->

            <div class="navigation">


                <a
                    href="{% url 'dashboard' %}"
                    class="nav-btn"
                >
                    <i class="bi bi-speedometer2">  Dashboard</i>
                        
                </a>


                <a
                    href="{% url 'employee_list' %}"
                    class="nav-btn"
                >
                     <i class="bi bi-people"> Employee List </i>
                         
                </a>


            </div>


            <a
                href="{% url 'employee_list' %}"
                class="back-link"
            >
                ← Back to Employee List
            </a>


        </section>


    </main>


</body>
</html>
```
